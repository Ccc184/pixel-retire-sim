<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>像素退休模拟器</title>
    <style>
      /* 加载骨架屏 - 与游戏霓虹像素风格一致 */
      .loading-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #0a0a1a 0%, #1a0a2e 50%, #0d1a0a 100%);
        font-family: 'Courier New', monospace;
        transition: opacity 0.5s ease;
      }
      .loading-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .loading-title {
        font-size: 28px;
        color: #ff2d95;
        text-shadow: 0 0 10px #ff2d95, 0 0 20px #c900ff, 0 0 40px rgba(201,0,255,0.5);
        letter-spacing: 4px;
        margin-bottom: 24px;
        animation: loadingPulse 2s ease-in-out infinite;
      }
      .loading-sub {
        font-size: 14px;
        color: #00d4ff;
        text-shadow: 0 0 6px #00d4ff, 0 0 14px #00d4ff;
        letter-spacing: 2px;
        animation: loadingBlink 1.2s ease-in-out infinite;
      }
      .loading-bar {
        width: 200px;
        height: 3px;
        background: rgba(0, 212, 255, 0.15);
        border: 1px solid rgba(0, 212, 255, 0.3);
        margin-top: 32px;
        overflow: hidden;
        position: relative;
      }
      .loading-bar-fill {
        width: 30%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #00d4ff, transparent);
        position: absolute;
        animation: loadingSlide 1.5s ease-in-out infinite;
      }
      @keyframes loadingPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
      @keyframes loadingBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes loadingSlide {
        0% { left: -30%; }
        100% { left: 100%; }
      }
    </style>
    <script>
      // 加载完成后淡出骨架屏，避免与 Vue 渲染冲突
      window.addEventListener('load', function() {
        setTimeout(function() {
          var el = document.getElementById('loading-screen');
          if (el) el.classList.add('fade-out');
        }, 200);
      });
    </script>
  </head>
  <body>
    <div id="loading-screen" class="loading-screen">
      <div class="loading-title">◆ 像素退休模拟器 ◆</div>
      <div class="loading-sub">LOADING...</div>
      <div class="loading-bar"><div class="loading-bar-fill"></div></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
